# Cloudflare Worker that starts Gmail Triage (sonthanh/ai-brain) on time.
# Setup / redeploy / token rotation: bun run scripts/setup-gmail-triage-scheduler.ts
# Secrets (never in git): GH_TOKEN, optional TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID.
name = "gmail-triage-scheduler"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
# UTC → CEST 07:23 ... 01:23. Only the 01:23-07:23 CEST night has no run, by design.
# Changing slots changes the ai-brain Actions bill (~60 min/month per daily slot):
# do the math in ai-brain working-rules.md § GitHub Actions budget first.
crons = ["23 5,7,9,11,13,15,18,23 * * *"]

[observability]
enabled = true
