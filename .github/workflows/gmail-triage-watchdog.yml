name: Gmail Triage Watchdog

# Cloud copy of the gmail-triage watchdog (scripts/gmail-triage-watchdog.ts).
# Re-dispatches "Gmail Triage" in sonthanh/ai-brain when GitHub cron skips a
# slot, so recovery no longer depends on the local Mac being awake
# (2026-10-01: three morning slots skipped while the Mac slept → 81 emails
# left unread).
#
# Cost: this repo is PUBLIC, so these runs are free. The dispatched triage
# run bills the private repo — the script's budget guard refuses at 1,900 min.
#
# Every 30 min at off-peak minutes: triage slots are 2 h apart and a slot
# counts as missed after 90 min, so each slot gets ~3 chances to be caught.
# This cron can skip too; a double dispatch just queues a no-op run.
#
# Requires secret AI_BRAIN_ACTIONS_TOKEN: fine-grained PAT, repository
# sonthanh/ai-brain only, permission "Actions: Read and write". When it
# expires every tick fails loudly (GitHub emails scheduled-run failures).
#
# Gotcha: GitHub disables schedules in public repos after 60 days with no
# commits. Re-enable with: gh workflow enable gmail-triage-watchdog.yml

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: gmail-triage-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Re-dispatch Gmail Triage if a slot was missed
        env:
          GH_TOKEN: ${{ secrets.AI_BRAIN_ACTIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret AI_BRAIN_ACTIONS_TOKEN is not set — see the header of this workflow"
            exit 1
          fi
          bun run scripts/gmail-triage-watchdog.ts
